<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap" rel="stylesheet" />
</head>

<body>
    <div class="job-portal-main-page">
        <div class="job-protal-main">
            <div class="job-portal-guide">
                <div class="job-portal-slogan">
                    <div>
                        <p class="job-portal-main-slogan">Let us find Jobs Best For you</p>
                        <p class="job-portal-sub-slogan">Ample Opportunities...</p>
                    </div><img src="image2.png" class="job-portal-illustration" />
                </div>
                <div class="job-portal-slogan-search">
                    <input name="search" class="navigation-bar-search" value=""
                        placeholder="Search Jobs by title, location or type">
                    <button class="job-pertal-filter-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewBox="0 0 24 24"
                            fill="none">
                            <path
                                d="M3 4.6C3 4.03995 3 3.75992 3.10899 3.54601C3.20487 3.35785 3.35785 3.20487 3.54601 3.10899C3.75992 3 4.03995 3 4.6 3H19.4C19.9601 3 20.2401 3 20.454 3.10899C20.6422 3.20487 20.7951 3.35785 20.891 3.54601C21 3.75992 21 4.03995 21 4.6V6.33726C21 6.58185 21 6.70414 20.9724 6.81923C20.9479 6.92127 20.9075 7.01881 20.8526 7.10828C20.7908 7.2092 20.7043 7.29568 20.5314 7.46863L14.4686 13.5314C14.2957 13.7043 14.2092 13.7908 14.1474 13.8917C14.0925 13.9812 14.0521 14.0787 14.0276 14.1808C14 14.2959 14 14.4182 14 14.6627V17L10 21V14.6627C10 14.4182 10 14.2959 9.97237 14.1808C9.94787 14.0787 9.90747 13.9812 9.85264 13.8917C9.7908 13.7908 9.70432 13.7043 9.53137 13.5314L3.46863 7.46863C3.29568 7.29568 3.2092 7.2092 3.14736 7.10828C3.09253 7.01881 3.05213 6.92127 3.02763 6.81923C3 6.70414 3 6.58185 3 6.33726V4.6Z"
                                stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </button>
                    <div class="job-filter-modal hideFilters">
                        <div class="job-filter-modal-overlay"></div>
                        <div class="job-filter-modal-content">
                            <div class="job-filter-modal-heading">Apply Filters
                                <div class="job-filter-modal-close-btn">&times;</div>
                            </div>
                            <div class="job-filter-modal-description">Apply filters to see desired results, filters can
                                be of <br />job type, location and experience</div>
                            <div class="job-filter-modal-options">
                                <select class="job-filter-modal-options-select" id="filterType1">
                                    <option value="">--Choose Job Type--</option>
                                    <option value="Part-time">Part Time</option>
                                    <option value="Full-time">Full Time</option>
                                    <option value="Remote">Remote</option>
                                </select>
                                <select class="job-filter-modal-options-select" id="filterType2">
                                    <option value="">--Choose Location--</option>
                                    <option value="Remote">Remote</option>
                                    <option value="Bangalore">Bangalore</option>
                                    <option value="Hyderabad">Hyderabad</option>
                                    <option value="Pune">Pune</option>
                                    <option value="Delhi">Delhi</option>
                                    <option value="Mumbai">Mumbai</option>
                                    <option value="Ahmedabad">Ahmedabad</option>
                                    <option value="Jaipur">Jaipur</option>
                                    <option value="Noida">Noida</option>
                                    <option value="Chennai">Chennai</option>
                                </select>
                                <select class="job-filter-modal-options-select" id="filterType3">
                                    <option value="">--Choose Experience--</option>
                                    <option value="02">0-2</option>
                                    <option value="25">2-5</option>
                                    <option value="58">5-8</option>
                                </select>
                            </div>
                            <div>
                                <div class="filter-add-button"> Add Filters
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="#fff" width="15px" height="150px"
                                        viewBox="0 0 24 24">
                                        <path
                                            d="m11.293 17.293 1.414 1.414L19.414 12l-6.707-6.707-1.414 1.414L15.586 11H6v2h9.586z" />
                                    </svg>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="job-portal-job-listings">
            </div>
        </div>
        <div class="job-portal-job-detail-modal hidden">
            <div class="job-detail-modal-overlay"></div>
            <div class="job-detai-modal-content">
                <div class="job-detail-modal-close-btn">&times;</div>
            </div>
        </div>
    </div>
</body>
<script src="script.js"></script>
</html>
